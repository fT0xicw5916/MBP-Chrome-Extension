<html>
    <head>
        <script src="scripts/index.js" defer></script>
    </head>
    <body>
        <h2>Simulate Exam</h2>
        <form id="sim-exam-form">
            <select id="mid-final">
                <option value="mid">Mid-term</option>
                <option value="final">Final</option>
            </select>
            <input type="number" id="target" required min="0" max="100" step="0.01" placeholder="Target overall">
            <button type="submit">Simulate</button>
        </form>
        <p id="result"></p>
    </body>
</html>
