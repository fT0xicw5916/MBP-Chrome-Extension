<html>
    <head>
        <link rel="stylesheet" href="css/style.css">
        <script src="scripts/index.js" defer></script>
    </head>
    <body>
        <h2 style="color: white; text-align: center; font-size: 200%;"><u>Simulate Exam</u></h2>
        <p style="color: white; text-align: center;" class="trigger"><u>How do I use this extension?</u></p>
        <div class="expand">
            <p style="color: white; text-align: center;">Select the exam that you're about to take, and input the target overall GPA you want to achieve after taking the exam. The extension will calculate the minimum score you need to get on your exam in order to achieve your target overall GPA.</p>
        </div>
        <br>
        <form id="sim-exam-form">
            <select id="mid-final" style="width: 100%;">
                <option value="mid">Mid-term</option>
                <option value="final">Final</option>
            </select>
            <br><br>
            <input type="number" id="target" required min="0" max="100" step="0.01" placeholder="Target overall" style="width: 110px;">
            <button type="submit">Simulate</button>
        </form>
        <strong><p id="result" style="color: white; text-align: center; font-size: 150%;"></p></strong>
    </body>
</html>
