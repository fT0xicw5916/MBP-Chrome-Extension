<html>
    <head>
        <link rel="stylesheet" href="css/popup.css">
        <script src="scripts/core_tasks.js" defer></script>
    </head>
    <body>
        <h2>Simulate Exam</h2>
        <form id="sim-exam-form">
            <select id="mid-final">
                <option value="mid">Mid-term</option>
                <option value="final">Final</option>
            </select>
            <input type="number" id="target" required min="0" max="100" step="0.01" placeholder="Target overall" style="width: 110px;">
            <button type="submit">Simulate</button>
        </form>
        <p id="result"></p>
        <h2>Simulate Task</h2>
        <form id="sim-task-form">
            <select id="categories"></select>
            <input type="number" id="raw-score" required min="0" placeholder="Raw score">
            <input type="number" id="max-score" required min="1" placeholder="Max score">
            <button type="submit">Simulate</button>
        </form>
    </body>
</html>
